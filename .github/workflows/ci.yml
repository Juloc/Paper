name: Paper CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Paper.sln

      - name: Build
        run: dotnet build Paper.sln --no-restore --configuration Release /p:UseSharedCompilation=false

      - name: Test
        run: dotnet test tests/Paper.Tests/Paper.Tests.csproj --no-build --no-restore --configuration Release /p:UseSharedCompilation=false --logger "trx;LogFileName=paper-tests.trx"

      - name: Validate Compose configuration
        env:
          PAPER_ADMIN_USERNAME: ci-admin
          PAPER_ADMIN_PASSWORD: ci-admin-password
          PAPER_POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config --quiet

      - name: Build container image
        run: docker compose build app
