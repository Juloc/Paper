services:
  storage-init:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /data/documents /data/consume /data/keys"]
    volumes:
      - paper_documents:/data/documents
      - paper_consume:/data/consume
      - paper_keys:/data/keys
    restart: "no"
  app:
    build:
      context: .
      dockerfile: src/Paper.Web/Dockerfile
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=paper;Username=paper;Password=${PAPER_POSTGRES_PASSWORD:?PAPER_POSTGRES_PASSWORD muss gesetzt sein};Maximum Pool Size=10
      Auth__Username: ${PAPER_ADMIN_USERNAME:?PAPER_ADMIN_USERNAME muss gesetzt sein}
      Auth__Password: ${PAPER_ADMIN_PASSWORD:?PAPER_ADMIN_PASSWORD muss gesetzt sein}
      Storage__RootPath: /data/documents
      Storage__Provider: ${PAPER_STORAGE_PROVIDER:-local}
      Consume__RootPath: /data/consume
      Storage__SmbRootPath: ${PAPER_STORAGE_SMB_ROOT_PATH:-}
      Storage__SmbUsername: ${PAPER_STORAGE_SMB_USERNAME:-}
      Storage__SmbPassword: ${PAPER_STORAGE_SMB_PASSWORD:-}
      Storage__SmbDomain: ${PAPER_STORAGE_SMB_DOMAIN:-}
      Storage__WakePolicy: ${PAPER_STORAGE_WAKE_POLICY:-Never}
      Storage__WakeMacAddress: ${PAPER_STORAGE_WAKE_MAC_ADDRESS:-}
      Storage__WakeBroadcastAddress: ${PAPER_STORAGE_WAKE_BROADCAST_ADDRESS:-255.255.255.255}
      Mail__Enabled: ${PAPER_MAIL_ENABLED:-false}
      Mail__AccountName: ${PAPER_MAIL_ACCOUNT_NAME:-default}
      Mail__Host: ${PAPER_MAIL_HOST:-}
      Mail__Port: ${PAPER_MAIL_PORT:-993}
      Mail__UseSsl: ${PAPER_MAIL_USE_SSL:-true}
      Mail__Username: ${PAPER_MAIL_USERNAME:-}
      Mail__Password: ${PAPER_MAIL_PASSWORD:-}
      Mail__Folder: ${PAPER_MAIL_FOLDER:-INBOX}
      Mail__PollSeconds: ${PAPER_MAIL_POLL_SECONDS:-300}
      Mail__MaxMessagesPerRun: ${PAPER_MAIL_MAX_MESSAGES_PER_RUN:-10}
      Mail__OnlyUnread: ${PAPER_MAIL_ONLY_UNREAD:-true}
      Mail__MarkSeen: ${PAPER_MAIL_MARK_SEEN:-false}
      Mail__FromContains: ${PAPER_MAIL_FROM_CONTAINS:-}
      Mail__SubjectContains: ${PAPER_MAIL_SUBJECT_CONTAINS:-}
      Mail__AttachmentExtensions: ${PAPER_MAIL_ATTACHMENT_EXTENSIONS:-.pdf,.jpg,.jpeg,.png,.tif,.tiff}
      Ocr__Language: deu+eng
      Ocr__PdfRenderDpi: ${PAPER_OCR_PDF_RENDER_DPI:-200}
      DataProtection__KeysDirectory: /data/keys
    ports:
      - "8080:8080"
    volumes:
      - paper_documents:/data/documents
      - paper_consume:/data/consume
      - paper_keys:/data/keys
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paper
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: ${PAPER_POSTGRES_PASSWORD:?PAPER_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - paper_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  paper_documents:
  paper_consume:
  paper_keys:
  paper_postgres:
